# Deploy a static website to AWS EC2 with GitLab CI/CD
# Stages: test -> deploy -> verify

stages:
  - test
  - deploy
  - verify

variables:
  EC2_USER: "ubuntu"
  SITE_TITLE: "My CI/CD Site"

check-html:
  stage: test
  image: alpine:3.20
  script:
    - echo "Checking that the website files exist..."
    - test -f public/index.html
    - grep -qi "<!DOCTYPE html>" public/index.html
    - grep -q "<title>" public/index.html
    - echo "HTML check passed"

deploy-to-ec2:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $EC2_HOST
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh -i "$SSH_PRIVATE_KEY" "$EC2_USER@$EC2_HOST" "rm -rf /var/www/html/*"
    - scp -i "$SSH_PRIVATE_KEY" -r public/* "$EC2_USER@$EC2_HOST:/var/www/html/"
    - echo "Deployed to http://$EC2_HOST"

verify-site:
  stage: verify
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $EC2_HOST
  script:
    - apk add --no-cache curl
    - curl --fail --silent --show-error "http://$EC2_HOST" -o page.html
    - grep -qi "<!DOCTYPE html>" page.html
    - grep -q "$SITE_TITLE" page.html
    - echo "Site is live at http://$EC2_HOST"
